plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ghostway'
    compileSdk 34

    defaultConfig {
        applicationId 'app.ghostway'
        minSdk 23
        targetSdk 34
        versionCode 11
        // 1.0.0 is the public release version. It must match package.json and
        // src/config.js CONFIG.version; scripts/release-version-check.mjs
        // asserts all three agree. versionCode stays above the internal 1.0.2
        // / 1.0.3 update-flow verification builds (codes 9 and 10).
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // CI injects keystore via secrets (ANDROID_KEYSTORE_B64 decoded to
            // a temp file; password in ANDROID_KEYSTORE_PASS). Local builds
            // fall back to the debug key when the env vars are absent.
            if (System.getenv('ANDROID_KEYSTORE_PASS')) {
                storeFile file(System.getenv('GHOSTWAY_KEYSTORE_FILE') ?: 'ghostway-release.keystore')
                storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                keyAlias 'ghostway'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PASS')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Asset loader: serves assets/www over https://appassets.androidplatform.net
    // so the PWA's fetch() calls (graph, camera snapshot, traffic cache) work.
    // Under file:// Chromium rejects fetch() outright, which silently disabled
    // the on-device routing engine and forced every route onto Valhalla.
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    // kotlin-stdlib 1.8 folds jdk7/jdk8 variants — force alignment to kill
    // duplicate-class failures between appcompat's 1.6.21 and newer stdlib.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib 1.8+ merged jdk7/jdk8 artifacts'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib 1.8+ merged jdk7/jdk8 artifacts'
        }
    }
}
