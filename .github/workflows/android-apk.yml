name: android-apk

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle PWA into Android assets
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build debug APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 || true
          ./gradlew assembleDebug --no-daemon

      - name: Checksums
        working-directory: android/app/build/outputs/apk/debug
        run: |
          cp app-debug.apk ghostway-android.apk
          sha256sum ghostway-android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostway-android-apk
          path: |
            android/app/build/outputs/apk/debug/ghostway-android.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish rolling release
        # Every green build updates the "android-latest" pre-release so GitHub's
        # Releases page always has the current APK. Tag is forced-moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Ghostway for Android — download & install" \
            --notes-file .github/RELEASE-NOTES-android.md \
            --prerelease \
            android/app/build/outputs/apk/debug/ghostway-android.apk \
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
