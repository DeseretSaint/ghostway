name: android-apk

on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'dist/**', '.github/workflows/android-apk.yml']
  schedule:
    - cron: '0 4 * * *'  # nightly 04:00 UTC — catches any missed src/dist changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle PWA into Android assets
        run: |
          npm install --no-audit --no-fund
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Build release APK (signed) + debug APK (fallback)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          gradle wrapper --gradle-version 8.7 || true
          # Decode the release keystore from repo secrets
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/ghostway-release.keystore
          export GHOSTWAY_KEYSTORE_FILE=/tmp/ghostway-release.keystore
          ./gradlew assembleRelease assembleDebug --no-daemon
      - name: Verify release signature
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null | sort -V | tail -1 || echo 34.0.0)
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/$BT/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3
      - name: Checksums
        working-directory: android/app/build/outputs/apk
        run: |
          cp release/app-release.apk release/ghostway-android.apk
          cp debug/app-debug.apk debug/ghostway-android-debug.apk
          sha256sum release/ghostway-android.apk debug/ghostway-android-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Guard release artifact signature (CN=Ghostway)
        # Blocking: the file about to be uploaded and published as
        # ghostway-android.apk must carry the release key. Android refuses to
        # replace a package across signatures (INSTALL_FAILED_UPDATE_INCOMPATIBLE,
        # 2026-10-20), so a debug- or wrong-key artifact must never ship under
        # the release name. A release build with no injected keystore silently
        # falls back to the debug key, which is exactly what this catches.
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/ghostway-android.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls "$SDK/build-tools/" | sort -V | tail -1)
          APKSIGNER="$SDK/build-tools/$BT/apksigner"
          echo "apksigner: $("$APKSIGNER" version)"
          echo "artifact: $(sha256sum "$APK")"
          if ! CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            echo "$CERTS"
            echo "::error::apksigner verify failed on $APK"
            exit 1
          fi
          echo "$CERTS" | grep -E 'certificate DN|certificate SHA-256 digest'
          if ! echo "$CERTS" | grep -q 'CN=Ghostway'; then
            echo "::error::$APK is not signed by CN=Ghostway; refusing to publish it as ghostway-android.apk"
            exit 1
          fi
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::$APK carries the Android debug certificate; refusing to publish it"
            exit 1
          fi
          echo "PASS: ghostway-android.apk is release-signed (CN=Ghostway)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostway-android-apk
          path: |
            android/app/build/outputs/apk/release/ghostway-android.apk
            android/app/build/outputs/apk/debug/ghostway-android-debug.apk
            android/app/build/outputs/apk/SHA256SUMS.txt

      - name: Publish rolling release
        # Every green build updates the "android-latest" pre-release so GitHub's
        # Releases page always has the current APK. Tag is forced-moved.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-latest
          # Build marker for the in-app update check (compared to __GW_COMMIT__).
          printf '\n\n_build: commit %s_\n' "${GITHUB_SHA:0:7}" >> .github/RELEASE-NOTES-android.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Ghostway for Android — download & install" \
            --notes-file .github/RELEASE-NOTES-android.md \
            android/app/build/outputs/apk/release/ghostway-android.apk \
            android/app/build/outputs/apk/debug/ghostway-android-debug.apk \
            android/app/build/outputs/apk/SHA256SUMS.txt
