name: refresh-graph

on:
  schedule:
    - cron: '20 14 2 * *' # 2nd of month, 14:20 UTC — day after camera-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (osm-pbf-parser for extraction)
        run: npm ci --no-audit --no-fund
      - name: Fetch fresh DeFlock camera snapshot
        run: node scripts/fetch-cameras.mjs
      - name: Download Utah OSM extract (Geofabrik)
        run: curl -sL --retry 3 --max-time 600 -o /tmp/utah-latest.osm.pbf https://download.geofabrik.de/north-america/us/utah-latest.osm.pbf
      - name: Extract roads + turn restrictions
        run: |
          # Pure-Node extractor (engine/extract-osm.mjs) — same path as local
          # builds. Writes engine/data/wasatch-roads.geojson (drivable ways
          # with osmId) + engine/data/restrictions.json (via-node restrictions).
          mkdir -p engine/data
          node --max-old-space-size=6144 engine/extract-osm.mjs /tmp/utah-latest.osm.pbf
      - name: Rebuild graph
        run: node engine/build-graph.mjs
      - name: Gate — strict-floor audit (0 violations required)
        run: node scripts/floor-audit.mjs
      - name: Gate — engine routing sanity
        run: node scripts/engine-check.mjs
      - name: Gate — turn restrictions enforced (GWR2)
        run: node --max-old-space-size=4096 scripts/turn-restrict-check.mjs
      - name: Commit if changed
        run: |
          git config user.name "ghostway-ci"
          git config user.email "ghostway-ci@users.noreply.github.com"
          git add public/graph/wasatch-graph.bin.gz public/cameras/cameras.geojson
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: monthly graph rebuild + camera snapshot refresh (CI)"
            git push
          fi
