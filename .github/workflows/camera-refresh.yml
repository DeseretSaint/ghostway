name: refresh-cameras

on:
  schedule:
    - cron: '40 13 1 * *' # 1st of month, 13:40 UTC (06:40 MT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch DeFlock snapshot
        run: node scripts/fetch-cameras.mjs
      - name: Commit if changed
        run: |
          git config user.name "ghostway-ci"
          git config user.email "ghostway-ci@users.noreply.github.com"
          git add public/cameras/cameras.geojson
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh DeFlock camera snapshot (monthly CI)"
            git push
          fi
